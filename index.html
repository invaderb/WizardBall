<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Phones: lay out at the screen's real width (not a shrunk desktop page), no pinch / double-tap zoom (a double tap is the
       slide), and use the whole screen round a notch (the touch buttons keep clear of it with safe-area insets). -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <link rel="icon" href="favicon.svg?v=5" type="image/svg+xml">
  <title>WizardBall</title>
  <!-- Link previews (Discord, iMessage, Slack, X...): the image must be a PNG / JPG at a full URL; 1200x630 is the usual card size -->
  <meta name="description" content="Wizards battle to the death for the WizardBall: one-button arcade soccer platforming. Play a friend, the computer, or online.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://wizardball.win/">
  <meta property="og:title" content="WizardBall">
  <meta property="og:description" content="Wizards battle to the death for the WizardBall: one-button arcade soccer platforming. Play a friend, the computer, or online.">
  <meta property="og:image" content="https://wizardball.win/preview.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#000000">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=MedievalSharp&family=Press+Start+2P&display=swap">
  <!-- The title-screen font: Wizard by Graphiqa Studio. DEMO, PERSONAL USE ONLY (see fonts/Wizard-READ-ME.txt). -->
  <link rel="preload" href="fonts/Wizard.ttf" as="font" type="font/ttf" crossorigin>
  <style>
    @font-face { font-family: 'Wizard'; src: url('fonts/Wizard.ttf') format('truetype'); font-display: swap; }
    /* Nothing scrolls or zooms under a finger: the page is exactly the screen. (The title screen scrolls itself, up and
       down only, if it doesn't fit: see #title.) */
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; touch-action: none; }
    /* No text selection or long-press callouts anywhere (Firefox for Android selected the button arrows), but the room-code box */
    body { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
    input, textarea { user-select: text; -webkit-user-select: text; }
    /* The arena fills the screen in either orientation, letterboxed to keep its shape. 100dvh is the height you can SEE on
       a phone (100vh includes the space under the address bar, which made the page scroll); 100vh is the fallback. */
    canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; object-fit: contain; display: block; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }

    /* Title screen: sits over the arena, which stays visible (dimmed) behind it. */
    #title { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center; overflow-y: auto; overflow-x: hidden; touch-action: pan-y; overscroll-behavior: contain; padding: 16px 0; gap: 22px; background: rgba(0, 0, 0, 0.82); color: #fff; font-family: 'Wizard', 'MedievalSharp', 'Palatino Linotype', serif; }
    #title[hidden] { display: none; }
    /* Auto-margined ends centre everything when it fits and let the page scroll when it doesn't. */
    #title::before, #title::after { content: ''; margin: auto; }
    /* The blue and red offsets are the two players' colors splitting the title apart. */
    #title h1 { margin: 0; font-weight: 400; font-size: clamp(56px, 13vw, 160px); letter-spacing: 4px; text-shadow: -5px 0 #48f, 5px 0 #f44, 0 0 40px rgba(255, 255, 255, 0.25); }
    #menu { display: flex; flex-direction: column; gap: 14px; width: min(360px, 80vw); }
    /* A wave runs through the title: each letter rises and falls in turn, then a pause. */
    #title h1 span span { display: inline-block; animation: wave 2.5s ease-in-out calc(var(--i) * 0.1s) infinite; }
    @keyframes wave { 0%, 16%, 100% { transform: translateY(0); } 8% { transform: translateY(-0.12em); } }
    @media (prefers-reduced-motion: reduce) { #title h1 span span { animation: none; } }
    #title button { font: inherit; font-size: 26px; padding: 10px 18px; background: transparent; color: #fff; border: 2px solid #fff; cursor: pointer; }
    #title button:hover, #title button:focus-visible { background: #fff; color: #000; outline: none; }
    .ai { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
    #ai-skill { padding: 8px; font: inherit; font-size: 22px; background: transparent; color: #fff; border: 2px solid #fff; cursor: pointer; }
    #ai-skill option { background: #000; color: #fff; }
    .join { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    #code-in { grid-column: 1 / -1; min-width: 0; padding: 8px; font: inherit; font-size: 26px; letter-spacing: 6px; text-align: center; text-transform: uppercase; background: transparent; color: #fff; border: 2px solid #888; }
    #code-in:focus { border-color: #fff; outline: none; }
    #room-code { min-height: 64px; font-size: 54px; letter-spacing: 12px; }
    #online-status { min-height: 24px; font-size: 20px; color: #aaa; }
    .hint { margin: 0; font-size: 16px; color: #888; }

    /* The Options dialog (level select, paste/copy JSON, link to the builder) and the level name on the menu */
    .level-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 20px; color: #ccc; }
    #options-dialog { width: min(520px, 92vw); max-height: 90dvh; overflow-y: auto; touch-action: pan-y; padding: 20px; background: #000; color: #fff; border: 2px solid #fff; font-family: inherit; }
    #options-dialog::backdrop { background: rgba(0, 0, 0, 0.7); }
    #options-dialog h2 { margin: 0 0 12px; font-weight: 400; font-size: 28px; }
    #options-dialog .level { margin-bottom: 14px; }

    /* Level select */
    .level { display: grid; gap: 6px; }
    .level label { font-size: 18px; color: #aaa; }
    #level-select { padding: 8px; font: inherit; font-size: 22px; background: transparent; color: #fff; border: 2px solid #fff; cursor: pointer; width: 100%; }
    #level-select option { background: #000; color: #fff; }
    .level-tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    #title button.small { font-size: 16px; padding: 4px 10px; border-width: 1px; }
    .small-link { font-size: 16px; color: #8cf; margin-left: auto; }
    #level-box { display: grid; gap: 6px; }
    #level-json { height: 90px; padding: 6px; background: #000; color: #8f8; border: 1px solid #888; font: 12px monospace; box-sizing: border-box; width: 100%; }
    #level-msg { min-height: 18px; font-size: 16px; color: #aaa; }

    /* Hosting + open games */
    .host { display: grid; gap: 6px; }
    .check { display: flex; gap: 8px; align-items: center; font-size: 18px; color: #aaa; cursor: pointer; }
    #lobby { width: min(560px, 92vw); }
    #lobby h2 { margin: 0 0 6px; font-weight: 400; font-size: 24px; display: flex; align-items: center; gap: 12px; }
    #games { display: grid; gap: 6px; }
    .game { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 6px 10px; border: 1px solid #555; font-size: 18px; }
    .game .info { flex: 1; min-width: 200px; }
    .game .code { letter-spacing: 3px; color: #8f8; }
    .games-note { margin: 0; font-size: 16px; color: #888; }

    /* Touch controls (touch.js): touch screens only, and under the title screen (z-index 20), so they show in a game.
       Grey and mostly see-through, so they don't hide the arena. Sized from the screen's short side, kept clear of
       notches and home bars with the safe-area insets. */
    #touch { display: none; }
    @media (hover: none) and (pointer: coarse) {
      #touch { display: block; position: fixed; inset: 0; z-index: 10; pointer-events: none; --b: clamp(60px, 17vmin, 120px); --gap: 3vmin; }
    }
    #touch button {
      position: absolute; width: var(--b); height: var(--b); padding: 0; border-radius: 50%; pointer-events: auto;
      background: rgba(128, 128, 128, 0.18); border: 2px solid rgba(200, 200, 200, 0.3); color: rgba(255, 255, 255, 0.45);
      font-size: calc(var(--b) * 0.36); line-height: 1; touch-action: none;
      user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    }
    /* (each button's own rule is "#touch #id" so it outranks "#touch button" above: sizes for jump and menu) */
    #touch button.on { background: rgba(160, 160, 160, 0.38); border-color: rgba(230, 230, 230, 0.5); }
    /* The joystick rests at the bottom left; a thumb anywhere on the left half moves it there (touch.js sets left / top). */
    #touch-stick { position: absolute; width: calc(var(--b) * 1.6); height: calc(var(--b) * 1.6); border-radius: 50%; pointer-events: none;
      background: rgba(128, 128, 128, 0.12); border: 2px solid rgba(200, 200, 200, 0.3);
      left: calc(var(--gap) + env(safe-area-inset-left)); bottom: calc(var(--gap) + env(safe-area-inset-bottom)); }
    #touch-stick.on { bottom: auto; transform: translate(-50%, -50%); border-color: rgba(230, 230, 230, 0.5); }
    #touch-stick > div { position: absolute; left: 25%; top: 25%; width: 50%; height: 50%; border-radius: 50%; background: rgba(200, 200, 200, 0.3); }
    #touch #touch-jump { right: calc(var(--gap) + env(safe-area-inset-right)); bottom: calc(var(--gap) + env(safe-area-inset-bottom)); width: calc(var(--b) * 1.25); height: calc(var(--b) * 1.25); }
    /* iOS holds back touches near the top edge of the screen (a swipe down from there is Notification Center), so keep it 28px+ clear */
    #touch #touch-menu { left: calc(var(--gap) + env(safe-area-inset-left)); top: calc(var(--gap) + max(28px, env(safe-area-inset-top))); width: calc(var(--b) * 0.6); height: calc(var(--b) * 0.6); font-size: calc(var(--b) * 0.26); }
  </style>
</head>
<body>
  <canvas id="c" width="1920" height="1000"></canvas>
  <div id="touch">
    <button type="button" id="touch-menu" data-touch="menu" aria-label="Back to the menu">&#9776;</button>
    <div id="touch-stick"><div></div></div>
    <button type="button" id="touch-jump" data-touch="jump" aria-label="Jump">&#9650;</button>
  </div>
  <div id="title">
    <h1 aria-label="WizardBall"><span aria-hidden="true"><span style="--i:0">W</span><span style="--i:1">i</span><span style="--i:2">z</span><span style="--i:3">a</span><span style="--i:4">r</span><span style="--i:5">d</span><span style="--i:6">B</span><span style="--i:7">a</span><span style="--i:8">l</span><span style="--i:9">l</span></span></h1>
    <div id="menu">
      <div class="level-row">
        <button type="button" id="level-prev" class="small" aria-label="Previous level" title="Previous level (Left arrow)">&#9664;</button>
        <span id="level-now"></span>
        <button type="button" id="level-next" class="small" aria-label="Next level" title="Next level (Right arrow)">&#9654;</button>
        <button type="button" id="options-btn" class="small">Options</button>
      </div>
      <button type="button" id="play-btn">Play</button>
      <div class="ai">
        <button type="button" id="ai-btn">Play vs computer</button>
        <select id="ai-skill" aria-label="Computer difficulty">
          <option value="easy">Easy</option>
          <option value="normal" selected>Normal</option>
          <option value="hard">Hard</option>
        </select>
      </div>
      <div class="host">
        <button type="button" id="host-btn">Host online game</button>
        <label class="check"><input type="checkbox" id="public-cb"> List it in Open games (everyone plays your level)</label>
      </div>
      <div class="join">
        <input id="code-in" maxlength="4" placeholder="CODE" aria-label="Room code" autocomplete="off" spellcheck="false">
        <button type="button" id="join-btn">Join room</button>
        <button type="button" id="watch-btn">Watch</button>
      </div>
    </div>
    <div id="room-code" aria-live="polite"></div>
    <div id="online-status" aria-live="polite"></div>
    <section id="lobby" aria-label="Open games">
      <h2>Open games <button type="button" id="games-refresh" class="small">Refresh</button></h2>
      <div id="games" aria-live="polite"></div>
    </section>
    <dialog id="options-dialog" aria-label="Options">
      <h2>Options</h2>
      <div class="level">
        <label for="level-select">Level</label>
        <select id="level-select"></select>
        <div class="level-tools">
          <button type="button" id="level-paste-btn" class="small">Paste level JSON</button>
          <button type="button" id="level-copy-btn" class="small">Copy level JSON</button>
          <a href="builder.html" class="small-link">Level builder &rarr;</a>
        </div>
        <div id="level-box" hidden>
          <textarea id="level-json" aria-label="Level JSON" placeholder="paste a level here" spellcheck="false"></textarea>
          <button type="button" id="level-use-btn" class="small">Use this level</button>
        </div>
        <div id="level-msg" aria-live="polite"></div>
      </div>
      <label class="check"><input type="checkbox" id="music-cb" checked> Music</label>
      <label class="check"><input type="checkbox" id="sfx-cb" checked> Sound effects</label>
      <button type="button" id="options-close" class="small">Close</button>
    </dialog>
    <p class="hint">Blue: W A S D, Space &middot; Red: arrows, Enter &middot; Controllers: stick, A, Start &middot; Air jumps go the way you point &middot; Esc: back to this menu</p>
  </div>
  <script src="level.js?v=5"></script>
  <script src="sprites.js?v=5"></script>
  <script src="net.js?v=5"></script>
  <script src="main.js?v=5"></script>
  <script src="online.js?v=5"></script>
  <script src="ai.js?v=5"></script>
  <script src="title.js?v=5"></script>
  <script src="touch.js?v=5"></script>
  <script src="gamepad.js?v=5"></script>
  <!-- ?v=: the live host lets browsers cache scripts for 4 hours, and the scripts depend on each other, so every script tag on both pages (index.html, builder.html) carries the same number: bump it on all of them whenever you deploy a change -->
</body>
</html>
