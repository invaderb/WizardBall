  <ellipse cx="15.5" cy="14.8" rx="11" ry="1.6" fill="#000" stroke="#fff" stroke-width="1.2"/>
  <!-- stars -->
  <path d="M12.3 9.3 l2.2 2.2 m0 -2.2 l-2.2 2.2 M16 6.4 l2 2 m0 -2 l-2 2 M18 10.4 l2.2 2.2 m0 -2.2 l-2.2 2.2" stroke="#ffd23f" stroke-width="1.4" stroke-linecap="round"/>
  <!-- a sparkle off the tip -->
