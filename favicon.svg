  </defs>
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <!-- the ball -->
  <circle cx="16" cy="22.5" r="8" fill="#000" stroke="#fff" stroke-width="2"/>
  <path d="M11 21 A5.5 5.5 0 0 0 13.5 27" fill="none" stroke="#fff" stroke-width="1.4" stroke-linecap="round"/>
  <!-- the hat: a cone with a curled tip, on a brim -->
